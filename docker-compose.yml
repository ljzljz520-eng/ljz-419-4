services:
  auth:
    build: ./services/auth
    ports:
      - "18001:8001"
    environment:
      DATABASE_URL: sqlite:////data/auth.db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - auth-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ticket:
    build: ./services/ticket
    ports:
      - "18002:8002"
    environment:
      DATABASE_URL: sqlite:////data/ticket.db
      AUTH_SERVICE_URL: http://auth:8001
    volumes:
      - ticket-data:/data
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth:8001
      TICKET_SERVICE_URL: http://ticket:8002
    depends_on:
      auth:
        condition: service_healthy
      ticket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  auth-data:
  ticket-data:
